<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator by Arpan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>BMI Calculator by Arpan</h2>
            <form id="bmiForm">
                <label for="gender">Gender:</label>
                <select id="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label for="age">Age:</label>
                <input type="number" id="age" placeholder="Enter your age" required>

                <label for="height-feet">Height:</label>
                <input type="number" id="height-feet" placeholder="Feet" required>
                <input type="number" id="height-inches" placeholder="Inches" required>

                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" placeholder="Enter your weight" required>

                <button type="submit">Calculate BMI</button>
            </form>

            <p id="result"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
